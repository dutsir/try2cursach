# Если фронт стоит за внешним TLS-терминатором (Caddy/nginx с certbot),
# берём протокол из X-Forwarded-Proto; иначе — собственный $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# Общий блок location'ов приложения подключается и в 80 (dev/без TLS),
# и в 443 (prod). Чтобы не дублировать — выносим в snippet через include
# нельзя (один файл), поэтому держим конфиг приложения в server 443,
# а server 80 только редиректит на https (кроме ACME-челленджа).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-челлендж Let's Encrypt (certbot --webroot). Раньше редиректа,
    # чтобы продление сертификата работало по http без перебоев.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scout-prices.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/scout-prices.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scout-prices.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 10m;

    # Django backend (admin, DRF browsable API, static, media).
    # Должно идти ДО SPA-fallback, иначе /admin/ уйдёт в index.html.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Статика и медиа Django (admin CSS/JS, DRF, загруженные файлы).
    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Статика SPA с долгим кэшем (хэшированные ассеты Vite).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все прочие запросы — на index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
