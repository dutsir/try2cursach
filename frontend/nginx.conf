# DEV / локальная сборка образа (HTTP-only, без TLS).
# На VPS этот файл перекрывается через volume-mount TLS-вариантом
# (см. docker-compose.vps.yml + frontend/nginx.vps.conf как образец).
# Dockerfile делает `COPY nginx.conf`, так что локально образ получает именно
# этот конфиг и слушает :80 без сертификатов.

# Если фронт стоит за внешним TLS-терминатором — берём протокол из
# X-Forwarded-Proto; иначе — собственный $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Docker DNS resolver: позволяет пере-резолвить имя `web`,
    # если backend-контейнер перезапустился и сменил IP.
    resolver 127.0.0.11 ipv6=off valid=30s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 10m;

    # Django backend (admin, DRF browsable API, static, media).
    # Должно идти ДО SPA-fallback, иначе /admin/ уйдёт в index.html.
    location /api/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /admin/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Статика и медиа Django (admin CSS/JS, DRF, загруженные файлы).
    location /static/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Статика SPA с долгим кэшем (хэшированные ассеты Vite).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все прочие запросы — на index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
