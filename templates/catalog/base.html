{% load humanize %}<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Price Monitor{% endblock %}</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e6e9f0;
            --muted: #6b7280;
            --text: #1f2937;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --good: #16a34a;
            --warn: #d97706;
            --bad: #dc2626;
            --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.45;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); text-decoration: underline; }

        header.site {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        header.site .logo {
            font-weight: 700;
            font-size: 18px;
            color: var(--text);
        }
        header.site nav a {
            color: var(--muted);
            margin-right: 16px;
            font-size: 14px;
        }

        main {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
        }
        h1, h2, h3 { color: var(--text); }
        h1 { font-size: 26px; margin: 0 0 18px; }
        h2 { font-size: 20px; margin: 18px 0 12px; }
        h3 { font-size: 16px; margin: 12px 0 8px; }

        .muted { color: var(--muted); font-size: 14px; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 18px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .cat-card {
            padding: 18px 20px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: box-shadow .15s;
        }
        .cat-card:hover { box-shadow: var(--shadow); }
        .cat-card .name { font-weight: 600; font-size: 16px; }
        .cat-card .count { color: var(--muted); font-size: 13px; margin-top: 4px; }

        table.offers, table.products {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        table.offers th, table.offers td,
        table.products th, table.products td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
        }
        table.offers th, table.products th {
            background: #fafbff;
            color: var(--muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: .04em;
        }
        table.offers tr:last-child td,
        table.products tr:last-child td { border-bottom: none; }

        .price {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            white-space: nowrap;
        }
        .price-old {
            text-decoration: line-through;
            color: var(--muted);
            font-size: 13px;
            margin-left: 6px;
            font-weight: 400;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #eef2ff;
            color: #3730a3;
            font-weight: 500;
        }
        .badge.src-dns { background: #fef3c7; color: #92400e; }
        .badge.src-citilink { background: #dcfce7; color: #166534; }
        .badge.src-ozon { background: #e0e7ff; color: #3730a3; }

        .avail { font-size: 12px; color: var(--good); }
        .unavail { font-size: 12px; color: var(--bad); }

        .btn {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 6px;
            background: var(--accent);
            color: #fff !important;
            font-size: 13px;
            text-decoration: none !important;
        }
        .btn:hover { background: var(--accent-hover); }

        .prod-header {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .prod-header img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .prod-header .info { flex: 1; min-width: 0; }
        .breadcrumb {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .breadcrumb a { color: var(--muted); }

        .summary-best {
            margin-top: 10px;
            font-size: 15px;
        }
        .summary-best .price { font-size: 24px; color: var(--good); }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
        }

        #price-chart { width: 100%; height: 280px; margin-top: 12px; }

        .cat-groups {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 18px;
        }
        .cat-group {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 18px;
            box-shadow: var(--shadow);
        }
        .cat-group__head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .cat-group__title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
        }
        .cat-group__title:hover { color: var(--accent); }
        .cat-group__list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cat-group__list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            font-size: 14px;
        }
        .cat-group__list li a { color: var(--text); }
        .cat-group__list li a:hover { color: var(--accent); }
        .cat-group__list li .muted { font-size: 12px; }

        .pstats {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }
        .pstats__badge {
            display: inline-block;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            margin-right: 6px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .pstats__badge--good { background: #dcfce7; color: #166534; }
        .pstats__badge--warn { background: #fef3c7; color: #92400e; }
        .pstats__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px 18px;
            margin: 10px 0 0;
        }
        .pstats__grid dt {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .03em;
            margin-bottom: 2px;
        }
        .pstats__grid dd {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .pstats__grid dd .muted {
            font-weight: 400;
            font-size: 12px;
            margin-left: 4px;
        }
        .pstats__delta--down { color: var(--good); }
        .pstats__delta--up { color: var(--bad); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header class="site">
    <a class="logo" href="{% url 'catalog:index' %}">Price Monitor</a>
    <nav>
        <a href="{% url 'catalog:index' %}">Каталог</a>
        <a href="/admin/" target="_blank">Админка</a>
        <a href="/api/" target="_blank">API</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
