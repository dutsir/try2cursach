services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: pm_postgres
    restart: unless-stopped
    shm_size: '4gb'
    environment:
      POSTGRES_DB: ${DB_NAME:-price_monitor}
      POSTGRES_USER: ${DB_USER:-pm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pm_secret}
    ports:
      # INFRA_BIND_ADDR: на VPS задать WG-адрес (напр. 10.10.0.1), чтобы БД/брокер
      # слушали ТОЛЬКО WireGuard-интерфейс, а не публичный IP. Дефолт 0.0.0.0 = как раньше (dev).
      - "${INFRA_BIND_ADDR:-0.0.0.0}:5432:5432"
    volumes:
      # ВАЖНО: образ timescale/timescaledb-ha хранит данные в /home/postgres/pgdata/data
      # а не в стандартном /var/lib/postgresql/data!
      # Если смонтировать неправильно, данные пропадут при пересоздании контейнера.
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_user} -d ${DB_NAME:-price_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pm_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${INFRA_BIND_ADDR:-0.0.0.0}:5672:5672"
      - "${INFRA_BIND_ADDR:-0.0.0.0}:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pm_redis
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_ADDR:-0.0.0.0}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: pm_web
    restart: unless-stopped
    env_file: .env
    # Перекрываем хосты из .env: внутри Docker-сети используются service names,
    # а .env по умолчанию настроен на localhost (для хостового Celery worker).
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      # HF-кэш с хоста: модель эмбеддингов (intfloat/multilingual-e5-base, ~1.1G)
      # уже скачана на хосте. Офлайн-флаги (.env: HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE/
      # DEDUP_EMBEDDING_LOCAL_FILES_ONLY=1) запрещают докачку в контейнере, поэтому
      # модель ДОЛЖНА лежать в кэше. На VPS: HF_HOME_DIR=путь_к_кэшу с предзагрузкой.
      - ${HF_HOME_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_categories --update &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  # Тяжёлый воркер: Selenium + Chrome (DNS, Citilink, Ozon).
  # concurrency=1 — один Chrome за раз, иначе на VPS закончится RAM (OOM).
  # Xvfb даёт виртуальный дисплей (надёжнее обходит 403 DNS, чем headless).
  celery-worker-heavy:
    profiles: ["docker-celery"]
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: pm_celery_worker_heavy
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    # Chrome без увеличенного /dev/shm падает на больших каталогах (дефолт Docker — 64M).
    shm_size: '1gb'
    # Xvfb поднимается надёжно в docker/celery-entrypoint.sh (с проверкой готовности
    # X-сервера и чисткой stale-локов). Команда передаётся entrypoint'у как аргументы:
    # folded-скаляр `>` склеивает строки в ОДНУ (отступ continuation == отступу первой
    # строки контента), без ловушки с переводами строк внутри sh -c.
    command: >
      /app/docker/celery-entrypoint.sh
      celery -A config worker --loglevel=info --pool=prefork
      --concurrency=${CELERY_HEAVY_CONCURRENCY:-1}
      -Q parsing_heavy
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10}
      --time-limit=${CELERY_HEAVY_TIME_LIMIT:-1800}
      --soft-time-limit=${CELERY_HEAVY_SOFT_TIME_LIMIT:-1680}
      --hostname=heavy@%h
    volumes:
      - .:/app
      # HF-кэш эмбеддингов с хоста (офлайн-флаги в .env запрещают докачку в контейнере).
      - ${HF_HOME_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      # Для переезда worker'а в Docker — раскомментировать чтобы переиспользовать
      # хостовые драйверы и warmed-up Chrome профили (избежать повторного Qrator-challenge):
      # - ~/.local/share/undetected_chromedriver:/root/.local/share/undetected_chromedriver
      # - ./var/chrome_profiles:/app/var/chrome_profiles
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Chrome + длинный скролл каталога DNS легко берёт >2.5GB → cgroup OOM-killed
          # воркер (SIGKILL), а acks_late=True переотправлял задачу по кругу. 4g даёт запас.
          memory: ${CELERY_HEAVY_MEM_LIMIT:-4g}
        reservations:
          memory: 1G

  # Лёгкий воркер: HTTP-парсеры (Wildberries, Regard) + быстрые задачи
  # (сохранение цен, подписки, очистки). Chrome не нужен, можно concurrency>1.
  celery-worker-light:
    profiles: ["docker-celery"]
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: pm_celery_worker_light
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    command: >
      celery -A config worker --loglevel=info --pool=prefork
      --concurrency=${CELERY_LIGHT_CONCURRENCY:-2}
      -Q parsing_light,default
      --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-20}
      --time-limit=${CELERY_LIGHT_TIME_LIMIT:-600}
      --soft-time-limit=${CELERY_LIGHT_SOFT_TIME_LIMIT:-540}
      --hostname=light@%h
    volumes:
      - .:/app
      # HF-кэш эмбеддингов с хоста (light тоже дедупит WB/Regard).
      - ${HF_HOME_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CELERY_LIGHT_MEM_LIMIT:-1500m}
        reservations:
          memory: 512m

  celery-beat:
    profiles: ["docker-celery"]
    build:
      context: .
      dockerfile: docker/Dockerfile.celerybeat
    container_name: pm_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web
    environment:
      # Если фронт нужно проксировать запросы на бэк, раскомментировать в nginx.conf
      BACKEND_URL: http://web:8000

volumes:
  # postgres_data — external volume (pm_postgres_data), Docker НЕ удалит его при `down -v`.
  # Создание и миграция данных с дефолтного volume — см. scripts/migrate_postgres_volume_to_external.sh
  postgres_data:
    external: true
    name: pm_postgres_data
  rabbitmq_data:
  redis_data:
  static_volume:
